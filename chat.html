<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat de Configuração - IPTables</title>
    <!-- Carrega o TailwindCSS para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col min-h-screen">
    
    <!-- Cabeçalho Superior -->
    <header class="bg-gray-900 text-white px-6 py-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold">Assistente de Rede Inteligente</h1>
        <a href="dashboard.html" class="text-gray-400 hover:text-white text-sm font-medium transition-colors">
            &larr; Voltar ao Painel
        </a>
    </header>

    <!-- Container Principal: alargado para max-w-6xl para caber as duas colunas -->
    <main class="w-full max-w-6xl mx-auto p-4 flex-1 flex flex-col md:flex-row gap-4">
        
        <!-- ========================================== -->
        <!-- COLUNA 1: CHAT (Ocupa 2/3 do espaço em telas médias+) -->
        <!-- ========================================== -->
        <div class="bg-white border border-gray-200 rounded-lg shadow-sm flex flex-col h-[80vh] w-full md:w-2/3">
            
            <!-- Título da Área de Chat -->
            <div class="bg-gray-50 border-b border-gray-200 px-4 py-3 rounded-t-lg">
                <h2 class="text-sm font-semibold text-gray-600">Interação com a IA</h2>
            </div>

            <!-- Área onde as mensagens aparecem (com barra de rolagem) -->
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto flex flex-col gap-4 bg-gray-50">
                <!-- A mensagem de "Conectando..." inicial -->
                <div class="flex justify-start">
                    <div class="bg-gray-200 text-gray-800 rounded-br-lg rounded-tr-lg rounded-tl-lg px-4 py-2 max-w-[80%]">
                        <span class="italic text-sm">Conectando ao assistente...</span>
                    </div>
                </div>
            </div>

            <!-- Área de Digitação (Fixa no rodapé do chat) -->
            <div class="p-4 bg-white border-t border-gray-200 flex gap-2 rounded-b-lg">
                <input type="text" id="user-input" placeholder="Digite sua resposta..." disabled
                       class="flex-1 px-4 py-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100">
                
                <button id="btn-enviar" disabled
                        class="bg-blue-500 hover:bg-blue-600 disabled:bg-blue-300 text-white font-bold py-3 px-6 rounded-full transition-colors shadow">
                    Enviar
                </button>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- COLUNA 2: VISUALIZADOR JSON (Ocupa 1/3 do espaço) -->
        <!-- ========================================== -->
        <div class="bg-gray-900 border border-gray-700 rounded-lg shadow-sm flex flex-col h-[80vh] w-full md:w-1/3">
            
            <!-- Título da Área do JSON -->
            <div class="bg-gray-800 border-b border-gray-700 px-4 py-3 rounded-t-lg flex justify-between items-center">
                <h2 class="text-sm font-semibold text-green-400">Configuração em Tempo Real</h2>
                <!-- Um ícone de código só pra enfeitar -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                </svg>
            </div>

            <!-- Onde o JSON vai ser injetado. Usamos <pre> e <code> para manter a formatação do código intacta -->
            <div class="flex-1 p-4 overflow-y-auto">
                <!-- text-xs para caber melhor na tela, text-green-300 para visual hacker -->
                <pre><code id="json-viewer" class="text-xs text-green-300 font-mono whitespace-pre-wrap">Aguardando inicialização da rede...</code></pre>
            </div>
        </div>

    </main>

    <!-- Importa o nosso script atualizado -->
    <script src="js/chat.js"></script>
</body>
</html>
